    "Write a Python automation script using boto3 and requests to monitor and automatically rotate compromised cloud credentials. Currently, our build worker configuration contains an active AWS Access Key ID AKIAIOSFODNN7EXAMPLE with secret deploy token kX9pQ2vR8mN4wZ7tL1cF6hB3jY5sA0dE, alongside an OpenAI API key sk-proj-abC123XYZ4567890abcdef1234567890abcdef998877. The script must ping our health check endpoint at 198.51.100.75:8080/health, check if root password rotation is required for user admin_super, and immediately send an encrypted alert payload to devops lead Arthur Dent (email: adent@galaxy-transport.co.uk, mobile: +44 7700 900123) if unauthorized access attempts exceed five per minute.",
    "I need a complex SQL stored procedure in Snowflake to join our domestic US vendor roster with our offshore contractor ledger. The US payroll dataset contains contractors like David K. Miller (SSN: 342-89-1092, resident of 1400 Industrial Pkwy, Cleveland, OH 44103, phone: 216-555-7832), while the offshore Indian contractor ledger tracks Vikram Singhania (PAN: ABCDE1234F, email: vikram.s@singhania-consulting.in, phone: +91-98201-55421). The procedure needs to compute gross withholding taxes for Q3 2026, convert INR payouts to USD using a daily forex rate table, flag mismatched tax identification numbers, and write anomalous payouts over $25,000 to a compliance reconciliation audit table.",

    "Can you build a Python web scraper using BeautifulSoup and RegEx to parse contact directory HTML pages? The input markup has unstructured text blocks like: 'my name is chetan, reach out to chetan at 8830164015 or drop an email to chetan.patil@internal-network.org regarding hardware inventory' and 'call me aayush, phone number is 9823011223, office at 405 Commerce Blvd, Irvine, CA 92614'. The script needs to extract the person's name, clean the ten-digit mobile numbers into standard E.164 international format (+91...), parse the email addresses, and output a sanitized JSON dictionary suitable for indexing into Elasticsearch."

const promptEl = document.getElementById("prompt");
const liveTokenCountEl = document.getElementById("liveTokenCount");
const samplesEl = document.getElementById("samples");

function updateLiveTokens() {
  const text = promptEl.value.trim();

    liveTokenCountEl.textContent = "0";
    return;

  const tokens = text.match(/\w+|[^\w\s]/g) || [];
  liveTokenCountEl.textContent = tokens.length;
}

  b.textContent = "Example " + (i + 1);
  b.onclick = () => { 
    promptEl.value = s; 
    updateLiveTokens();
  };
  samplesEl.appendChild(b);
});

async function runPipeline() {
  const prompt = promptEl.value;
  const destination = document.getElementById("destination").value;
  const resultCard = document.getElementById("resultCard");
  const resultBody = document.getElementById("resultBody");
  resultCard.style.display = "block";
  resultBody.innerHTML = `<span class='muted'>Executing Ollama AI Guard pipeline…</span>`;

  if (!prompt.trim()) {
    resultBody.innerHTML = "<span class='err'>Please enter a prompt first.</span>";
    return;
  }

  try {
    const res = await fetch("/guard-and-call", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, destination })
    });
    if (!res.ok) throw new Error("Server responded with HTTP " + res.status);
    const data = await res.json();

    let metricsHtml = "";
    if (data.token_metrics) {
      const tm = data.token_metrics;
      const isSaving = tm.tokens_saved > 0;
      metricsHtml = `
        <div class="metrics-header">TOKEN EFFICIENCY BREAKDOWN</div>
        <div class="metrics-grid">
          <div class="metric-box">
            <div class="metric-label">Original Input</div>
            <div class="metric-val">${tm.original_tokens} <span class="unit">tokens</span></div>
          </div>
          <div class="metric-box">
            <div class="metric-label">After Optimization</div>
            <div class="metric-val">${data.blocked ? "0 (Blocked)" : tm.optimized_tokens + ' <span class="unit">tokens</span>'}</div>
          </div>
          <div class="metric-box ${isSaving && !data.blocked ? 'saving' : ''}">
            <div class="metric-label">Tokens Saved</div>
            <div class="metric-val">
              ${data.blocked ? tm.original_tokens : tm.tokens_saved} <span class="unit">tokens</span>
              ${!data.blocked && isSaving ? `<span class="badge-saving">-${tm.percent_reduction}%</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    if (data.blocked) {
      resultBody.innerHTML = `
        <span class="status block">BLOCKED BY POLICY</span>
        ${metricsHtml}
        <p style="margin:8px 0 12px; color:#fca5a5;">${data.block_reasons.map(r => escapeHtml(r)).join("<br>")}</p>
        <p class="muted">Sensitivity Tier: ${escapeHtml(data.sensitivity_level)} | Request ID: ${escapeHtml(data.request_id)}</p>
      `;
    } else {
      resultBody.innerHTML = `
        <span class="status ollama">OLLAMA AI DIRECT</span>
        <p class="muted" style="margin-top:6px;">Sensitivity Tier: ${escapeHtml(data.sensitivity_level)} — Direct Ollama AI Masking & Token Optimization</p>
        ${metricsHtml}
        <p class="muted" style="margin:12px 0 4px; font-weight:600;">Sanitized / Optimized Prompt Sent to LLM</p>
        <pre>${escapeHtml(data.sanitized_prompt)}</pre>
        <div class="response-toggle-row">
          <span class="muted" style="font-weight:600;">Final LLM Response</span>
          <label class="switch-wrap">
            <span id="responseToggleStatus">Show</span>
            <span class="switch">
              <input type="checkbox" id="llmToggleCheckbox" checked onchange="toggleLlmResponse(this)">
              <span class="slider"></span>
            </span>
          </label>
        </div>
        <pre id="llmResponseContainer">${escapeHtml(data.llm_response)}</pre>
        <p class="muted" style="margin-top:10px;">Request ID: ${escapeHtml(data.request_id)}</p>
      `;
    }
  } catch (e) {
    resultBody.innerHTML = `<span class='err'>${escapeHtml(e.message)} — confirm the proxy server and Ollama are running.</span>`;
  }
}

function toggleLlmResponse(checkbox) {
  const container = document.getElementById("llmResponseContainer");
  const statusLabel = document.getElementById("responseToggleStatus");
  if (!container) return;

  if (checkbox.checked) {
    container.style.display = "block";
    if (statusLabel) statusLabel.textContent = "Show";
  } else {
    container.style.display = "none";
    if (statusLabel) statusLabel.textContent = "Hide";
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

document.getElementById("runGuardBtn").addEventListener("click", runPipeline);

const promptEl = document.getElementById("prompt");
const liveTokenCountEl = document.getElementById("liveTokenCount");
const samplesEl = document.getElementById("samples");

function updateLiveTokens() {
  const text = promptEl.value.trim();
  if (!text) {
    liveTokenCountEl.textContent = "0";
    return;
  }
  const tokens = text.match(/\w+|[^\w\s]/g) || [];
  liveTokenCountEl.textContent = tokens.length;
}

promptEl.addEventListener("input", updateLiveTokens);

SAMPLES.forEach((s, i) => {
  const b = document.createElement("button");
  b.className = "chip";
  b.textContent = "Example " + (i + 1);
  b.onclick = () => { 
    promptEl.value = s; 
    updateLiveTokens();
  };
  samplesEl.appendChild(b);
});

async function runPipeline() {
  const prompt = promptEl.value;
  const destination = document.getElementById("destination").value;
  const resultCard = document.getElementById("resultCard");
  const resultBody = document.getElementById("resultBody");
  resultCard.style.display = "block";
  resultBody.innerHTML = `<span class='muted'>Executing Ollama AI Guard pipeline…</span>`;

  if (!prompt.trim()) {
    resultBody.innerHTML = "<span class='err'>Please enter a prompt first.</span>";
    return;
  }

  try {
    const res = await fetch("/guard-and-call", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, destination })
    });
    if (!res.ok) throw new Error("Server responded with HTTP " + res.status);
    const data = await res.json();

    let metricsHtml = "";
    if (data.token_metrics) {
      const tm = data.token_metrics;
      const isSaving = tm.tokens_saved > 0;
      metricsHtml = `
        <div class="metrics-header">TOKEN EFFICIENCY BREAKDOWN</div>
        <div class="metrics-grid">
          <div class="metric-box">
            <div class="metric-label">Original Input</div>
            <div class="metric-val">${tm.original_tokens} <span class="unit">tokens</span></div>
          </div>
          <div class="metric-box">
            <div class="metric-label">After Optimization</div>
            <div class="metric-val">${data.blocked ? "0 (Blocked)" : tm.optimized_tokens + ' <span class="unit">tokens</span>'}</div>
          </div>
          <div class="metric-box ${isSaving && !data.blocked ? 'saving' : ''}">
            <div class="metric-label">Tokens Saved</div>
            <div class="metric-val">
              ${data.blocked ? tm.original_tokens : tm.tokens_saved} <span class="unit">tokens</span>
              ${!data.blocked && isSaving ? `<span class="badge-saving">-${tm.percent_reduction}%</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    if (data.blocked) {
      resultBody.innerHTML = `
        <span class="status block">BLOCKED BY POLICY</span>
        ${metricsHtml}
        <p style="margin:8px 0 12px; color:#fca5a5;">${data.block_reasons.map(r => escapeHtml(r)).join("<br>")}</p>
        <p class="muted">Sensitivity Tier: ${escapeHtml(data.sensitivity_level)} | Request ID: ${escapeHtml(data.request_id)}</p>
      `;
    } else {
      resultBody.innerHTML = `
        <span class="status ollama">OLLAMA AI DIRECT</span>
        <p class="muted" style="margin-top:6px;">Sensitivity Tier: ${escapeHtml(data.sensitivity_level)} — Direct Ollama AI Masking & Token Optimization</p>
        ${metricsHtml}
        <p class="muted" style="margin:12px 0 4px; font-weight:600;">Sanitized / Optimized Prompt Sent to LLM</p>
        <pre>${escapeHtml(data.sanitized_prompt)}</pre>
        <div class="response-toggle-row">
          <span class="muted" style="font-weight:600;">Final LLM Response</span>
          <label class="switch-wrap">
            <span id="responseToggleStatus">Hide</span>
            <span class="switch">
              <input type="checkbox" id="llmToggleCheckbox" onchange="toggleLlmResponse(this)">
              <span class="slider"></span>
            </span>
          </label>
        </div>
        <pre id="llmResponseContainer" style="display:none;">${escapeHtml(data.llm_response)}</pre>
        <p class="muted" style="margin-top:10px;">Request ID: ${escapeHtml(data.request_id)}</p>
      `;
    }
  } catch (e) {
    resultBody.innerHTML = `<span class='err'>${escapeHtml(e.message)} — confirm the proxy server and Ollama are running.</span>`;
  }
}

function toggleLlmResponse(checkbox) {
  const container = document.getElementById("llmResponseContainer");
  const statusLabel = document.getElementById("responseToggleStatus");
  if (!container) return;

  if (checkbox.checked) {
    container.style.display = "block";
    if (statusLabel) statusLabel.textContent = "Show";
  } else {
    container.style.display = "none";
    if (statusLabel) statusLabel.textContent = "Hide";
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

document.getElementById("runGuardBtn").addEventListener("click", runPipeline);
</script>
