<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prompt guard console</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0f1115; color: #e8e8e6;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.6;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
  .sub { color: #9a9a95; font-size: 13.5px; margin: 0 0 24px; }
  .card { background: #17191f; border: 1px solid #2a2c33; border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; font-weight: 500; margin: 0 0 10px; color: #cfcfca; }
  textarea {
    width: 100%; min-height: 100px; resize: vertical; border-radius: 6px;
    border: 1px solid #2a2c33; background: #0f1115; color: #e8e8e6;
    padding: 10px; font-size: 13.5px; font-family: inherit;
  }
  select, button {
    font-size: 13px; padding: 7px 12px; border-radius: 6px; border: 1px solid #2a2c33;
    background: #0f1115; color: #e8e8e6; font-family: inherit; cursor: pointer;
  }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .samples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 12px; padding: 5px 10px; border-radius: 999px; }
  .chip:hover { border-color: #52545c; }
  button.run { background: #e8e8e6; color: #0f1115; font-weight: 500; border: none; padding: 9px 16px; }
  pre {
    font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12.5px;
    white-space: pre-wrap; word-break: break-word; background: #0f1115;
    border: 1px solid #2a2c33; border-radius: 6px; padding: 12px; margin: 0;
  }
  .status { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; display: inline-block; margin-bottom: 8px; }
  .status.allow { background: #17331a; color: #97c459; }
  .status.block { background: #3a1616; color: #f09595; }
  .muted { color: #6f716f; font-size: 12.5px; }
  .err { color: #f09595; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Prompt guard console</h1>
  <p class="sub">Live against this deployment's actual /guard-and-call endpoint — not a simulation.</p>

  <div class="card">
    <h2>Prompt</h2>
    <textarea id="prompt" placeholder="Type a prompt to test"></textarea>
    <div class="samples" id="samples"></div>
    <div class="row">
      <label class="muted" for="destination">Destination</label>
      <select id="destination">
        <option value="any">any (public)</option>
        <option value="approved_enterprise_ai">approved_enterprise_ai</option>
        <option value="approved_enterprise_ai_restricted">approved_enterprise_ai_restricted</option>
      </select>
      <button class="run" id="runBtn">Run</button>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <h2>Result</h2>
    <div id="resultBody"></div>
  </div>
</div>

<script>
const SAMPLES = [
  "Email John Smith at john.smith@acme.com about his order, phone 415-555-0192",
  "Card number 4111 1111 1111 1111 was charged twice",
  "Here's the deploy token: kX9pQ2vR8mN4wZ7tL1cF6hB3jY5sA0dE",
  "Here's our internal architecture and customer list for review",
  "What's a good subject line for a product launch email?"
];

const samplesEl = document.getElementById("samples");
SAMPLES.forEach((s, i) => {
  const b = document.createElement("button");
  b.className = "chip";
  b.textContent = "Example " + (i + 1);
  b.onclick = () => { document.getElementById("prompt").value = s; };
  samplesEl.appendChild(b);
});

async function run() {
  const prompt = document.getElementById("prompt").value;
  const destination = document.getElementById("destination").value;
  const resultCard = document.getElementById("resultCard");
  const resultBody = document.getElementById("resultBody");
  resultCard.style.display = "block";
  resultBody.innerHTML = "<span class='muted'>Running…</span>";

  if (!prompt.trim()) {
    resultBody.innerHTML = "<span class='err'>Enter a prompt first.</span>";
    return;
  }

  try {
    const res = await fetch("/guard-and-call", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, destination })
    });
    if (!res.ok) throw new Error("Request failed: " + res.status);
    const data = await res.json();

    if (data.blocked) {
      resultBody.innerHTML = `
        <span class="status block">BLOCKED</span>
        <p style="margin:6px 0 12px;">${data.block_reasons.map(r => escapeHtml(r)).join("<br>")}</p>
        <p class="muted">Sensitivity: ${escapeHtml(data.sensitivity_level)}</p>
        <p class="muted">Request ID: ${escapeHtml(data.request_id)}</p>
      `;
    } else {
      resultBody.innerHTML = `
        <span class="status allow">ALLOWED</span>
        <p class="muted" style="margin-top:8px;">Sensitivity: ${escapeHtml(data.sensitivity_level)} — Detected: ${JSON.stringify(data.entity_counts)}</p>
        <p class="muted" style="margin:10px 0 4px;">Sanitized prompt sent to LLM</p>
        <pre>${escapeHtml(data.sanitized_prompt)}</pre>
        <p class="muted" style="margin:10px 0 4px;">LLM response (rehydrated for user)</p>
        <pre>${escapeHtml(data.llm_response)}</pre>
        <p class="muted" style="margin-top:10px;">Request ID: ${escapeHtml(data.request_id)}</p>
      `;
    }
  } catch (e) {
    resultBody.innerHTML = `<span class="err">${escapeHtml(e.message)} — is the server running?</span>`;
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

document.getElementById("runBtn").addEventListener("click", run);
</script>
</body>
</html>
